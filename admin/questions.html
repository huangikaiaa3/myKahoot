<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>題庫管理｜火花問答</title>
    <style>
      :root { color: #121b3a; font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; background: #edf1ff; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { width: min(920px, calc(100% - 32px)); margin: 40px auto; }
      h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.5rem); letter-spacing: -.06em; }
      .subtitle { margin: 10px 0 28px; color: #52607f; }
      .question { margin: 18px 0; padding: 24px; background: #fff; border-radius: 16px; box-shadow: 0 5px 0 #cbd3ed; }
      .question-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 16px; }
      label { display: grid; gap: 7px; margin-top: 14px; color: #465374; font-size: .82rem; font-weight: 700; }
      input, textarea, select, button { font: inherit; }
      input, textarea, select { width: 100%; padding: 11px; border: 1px solid #bcc7e4; border-radius: 9px; background: #fff; color: #121b3a; }
      textarea { min-height: 72px; resize: vertical; }
      .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .answer-entry { display: grid; gap: 7px; color: #465374; font-size: .82rem; font-weight: 700; }
      .answer-entry-controls { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
      .remove-answer { padding: 9px 12px; }
      .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .image-preview { margin-top: 10px; }
      .image-preview[hidden] { display: none; }
      .image-preview-list { display: grid; grid-template-columns: repeat(2, minmax(0, 180px)); gap: 12px; }
      .image-preview-item { display: grid; gap: 8px; }
      .image-preview img { display: block; width: 100%; height: 140px; object-fit: contain; border: 1px solid #bcc7e4; border-radius: 9px; background: #f5f7ff; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
      button { cursor: pointer; border: 0; border-radius: 10px; padding: 12px 16px; font-weight: 700; }
      .primary { color: #fff; background: #7255db; }.secondary { color: #121b3a; background: #dfe6fa; }.danger { color: #9b2830; background: #ffe2e3; }
      #message { min-height: 24px; margin-top: 16px; font-weight: 700; }.error { color: #b4232a; }.success { color: #167a55; }
      @media (max-width: 600px) { main { width: min(100% - 24px, 920px); margin: 24px auto; }.answers, .settings { grid-template-columns: 1fr; }.question { padding: 18px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>題庫管理</h1>
      <p class="subtitle">儲存後會立即寫入伺服器。遊戲進行時無法修改題目。</p>
      <form id="questions-form">
        <div id="questions"></div>
        <div class="actions">
          <button type="button" class="secondary" id="add-question">新增題目</button>
          <button type="submit" class="primary">儲存變更</button>
        </div>
      </form>
      <div id="message" role="status"></div>
    </main>
    <template id="question-template">
      <section class="question">
        <div class="question-head"><strong class="question-number"></strong><button type="button" class="danger remove-question">刪除此題</button></div>
        <label>題目<textarea class="prompt" required></textarea></label>
        <div class="answers"></div>
        <div class="actions"><button type="button" class="secondary add-answer">新增選項</button></div>
        <div class="settings">
          <label>正確答案<select class="correct"></select></label>
          <label>作答時間（秒）<input class="time-limit" type="number" min="5" max="120" required></label>
        </div>
        <label>答案說明（選填）<textarea class="description" maxlength="1000" placeholder="公布答案時顯示，例如：補充說明或小知識"></textarea></label>
        <label>公布答案時的圖片（選填，最多兩張）<input class="image-files" type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple></label>
        <div class="image-preview" hidden><div class="image-preview-list"></div></div>
      </section>
    </template>
    <script>
      const questionsRoot = document.querySelector('#questions');
      const template = document.querySelector('#question-template');
      const message = document.querySelector('#message');

      function showMessage(text, kind = '') {
        message.textContent = text;
        message.className = kind;
      }

      function renumber() {
        document.querySelectorAll('.question').forEach((question, index) => {
          question.querySelector('.question-number').textContent = `第 ${index + 1} 題`;
        });
      }

      function refreshAnswerControls(question) {
        const answers = [...question.querySelectorAll('.answer')];
        const correct = question.querySelector('.correct');
        const selected = Math.min(Number(correct.value) || 0, answers.length - 1);
        answers.forEach((input, index) => {
          input.closest('.answer-entry').querySelector('.answer-number').textContent = `選項 ${index + 1}`;
          input.closest('.answer-entry').querySelector('.remove-answer').disabled = answers.length <= 2;
        });
        correct.replaceChildren(...answers.map((_, index) => {
          const option = document.createElement('option');
          option.value = index;
          option.textContent = `選項 ${index + 1}`;
          return option;
        }));
        correct.value = String(selected);
      }

      function addAnswer(question, value = '') {
        const entry = document.createElement('label');
        entry.className = 'answer-entry';
        const number = document.createElement('span');
        number.className = 'answer-number';
        const controls = document.createElement('div');
        controls.className = 'answer-entry-controls';
        const input = document.createElement('input');
        input.className = 'answer';
        input.required = true;
        input.value = value;
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'danger remove-answer';
        remove.textContent = '移除';
        remove.addEventListener('click', () => {
          if (question.querySelectorAll('.answer').length <= 2) return;
          entry.remove();
          refreshAnswerControls(question);
        });
        controls.append(input, remove);
        entry.append(number, controls);
        question.querySelector('.answers').append(entry);
        refreshAnswerControls(question);
      }

      function setImagePreview(element, imageUrls = []) {
        const preview = element.querySelector('.image-preview');
        const previewList = element.querySelector('.image-preview-list');
        element.dataset.imageUrls = JSON.stringify(imageUrls);
        preview.hidden = imageUrls.length === 0;
        previewList.replaceChildren(...imageUrls.map((imageUrl, index) => {
          const item = document.createElement('div');
          item.className = 'image-preview-item';
          const image = document.createElement('img');
          image.src = imageUrl;
          image.alt = `公布答案時顯示的圖片 ${index + 1}`;
          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'secondary';
          remove.textContent = '移除圖片';
          remove.addEventListener('click', () => {
            const currentUrls = JSON.parse(element.dataset.imageUrls || '[]');
            currentUrls.splice(index, 1);
            setImagePreview(element, currentUrls);
          });
          item.append(image, remove);
          return item;
        }));
      }

      function addQuestion(question = { prompt: '', answers: ['', ''], correct: 0, time_limit: 20, description: '', image_urls: [] }) {
        const element = template.content.firstElementChild.cloneNode(true);
        element.querySelector('.prompt').value = question.prompt;
        (question.answers?.length >= 2 ? question.answers : ['', '']).forEach((answer) => addAnswer(element, answer));
        element.querySelector('.correct').value = question.correct;
        refreshAnswerControls(element);
        element.querySelector('.time-limit').value = question.time_limit;
        element.querySelector('.description').value = question.description || '';
        setImagePreview(element, question.image_urls || []);
        element.querySelector('.remove-question').addEventListener('click', () => { element.remove(); renumber(); });
        element.querySelector('.add-answer').addEventListener('click', () => addAnswer(element));
        questionsRoot.append(element);
        renumber();
      }

      async function uploadImage(file) {
        const formData = new FormData();
        formData.append('image', file);
        const response = await fetch('/api/question-images', { method: 'POST', body: formData });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.detail || '圖片上傳失敗。');
        return data.image_url;
      }

      async function readQuestions() {
        return Promise.all([...document.querySelectorAll('.question')].map(async (question) => {
          const imageFiles = [...question.querySelector('.image-files').files];
          const existingImageUrls = JSON.parse(question.dataset.imageUrls || '[]');
          if (existingImageUrls.length + imageFiles.length > 2) {
            throw new Error('每一題最多可設定兩張圖片。');
          }
          const imageUrls = [...existingImageUrls, ...await Promise.all(imageFiles.map(uploadImage))];
          return {
          prompt: question.querySelector('.prompt').value,
          answers: [...question.querySelectorAll('.answer')].map((input) => input.value),
          correct: Number(question.querySelector('.correct').value),
          time_limit: Number(question.querySelector('.time-limit').value),
          description: question.querySelector('.description').value,
          image_urls: imageUrls,
          };
        }));
      }

      async function loadQuestions() {
        const response = await fetch('/api/questions');
        if (!response.ok) throw new Error('無法載入題庫。');
        const { questions } = await response.json();
        questions.forEach(addQuestion);
      }

      document.querySelector('#add-question').addEventListener('click', () => addQuestion());
      document.querySelector('#questions-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        showMessage('正在儲存…');
        try {
          const response = await fetch('/api/questions', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ questions: await readQuestions() }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) { showMessage(data.detail || '儲存失敗。', 'error'); return; }
          document.querySelectorAll('.question').forEach((question) => {
            const files = question.querySelector('.image-files').files;
            if (files.length) setImagePreview(question, data.questions[[...document.querySelectorAll('.question')].indexOf(question)].image_urls || []);
            question.querySelector('.image-files').value = '';
          });
          showMessage('題庫已儲存。', 'success');
        } catch (error) {
          showMessage(error.message || '儲存失敗。', 'error');
        }
      });

      loadQuestions().catch((error) => showMessage(error.message, 'error'));
    </script>
  </body>
</html>
